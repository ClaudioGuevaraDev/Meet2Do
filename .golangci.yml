# Configuración recomendada por la skill golang-patterns, en formato golangci-lint v2
# (en v2 gosimple vive dentro de staticcheck y gofmt/goimports son formatters).
# misspell no se habilita: solo conoce inglés y los textos del proyecto están en español.
version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - unconvert
    - unparam
  settings:
    errcheck:
      check-type-assertions: true
    govet:
      enable:
        - shadow

formatters:
  enable:
    - gofmt
    - goimports
