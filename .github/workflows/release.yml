name: Release

# Publica un release cada vez que llega a main una versión nueva (la constante `version` de
# internal/cli/cli.go, que /conventional-commit sube en cada commit). install.sh descarga de aquí.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # para ver los tags existentes

      - name: Leer versión
        id: version
        run: |
          version=$(sed -n 's/^const version = "\(.*\)"$/\1/p' internal/cli/cli.go)
          if [ -z "$version" ]; then
            echo "::error::no se encontró la constante version en internal/cli/cli.go"
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version ya está publicada: no hay nada que hacer."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v7
        if: steps.version.outputs.exists == 'false'
        with:
          go-version-file: go.mod

      - name: Test
        if: steps.version.outputs.exists == 'false'
        run: go test ./...

      - name: Compilar binarios
        if: steps.version.outputs.exists == 'false'
        run: make dist

      - name: Publicar release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" dist/meet2do-linux-*.tar.gz dist/checksums.txt \
            --target "$GITHUB_SHA" \
            --title "Meet2Do $TAG" \
            --generate-notes
